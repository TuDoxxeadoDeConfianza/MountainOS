<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS (Debian GNOME)</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="https://unpkg.com/v86@latest/build/libv86.js"></script>
  <style>
    :root {
      --mac-bar: rgba(30, 30, 30, 0.75);
      --mac-text: #f5f5f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* macOS Menu Bar */
    .top-bar {
      height: 28px;
      background: var(--mac-bar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      font-size: 13px;
      color: var(--mac-text);
      user-select: none;
      z-index: 10;
    }
    .left-menu span { margin-right: 15px; font-weight: 500; cursor: default; }
    .apple-logo { font-size: 15px; margin-right: 18px !important; }
    /* VM Display Window */
    .viewport {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 28px);
      padding: 16px;
    }
    #screen_container {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      background: #000;
      position: relative;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="left-menu">
      <span class="apple-logo"></span>
      <span style="font-weight: 700;">Finder</span>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
      <span>Terminal</span>
    </div>
    <div class="right-menu">
      <span id="clock">10:42 AM</span>
    </div>
  </div>

  <div class="viewport">
    <div id="screen_container">
      <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
      <canvas></canvas>
    </div>
  </div>

  <script>
    // Live Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Boot Debian in Browser via v86
    window.addEventListener("load", () => {
      const emulator = new V86Starter({
        wasm_path: "https://unpkg.com/v86@latest/build/v86.wasm",
        memory_size: 512 * 1024 * 1024, // 512MB RAM
        vga_memory_size: 16 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: "https://unpkg.com/v86@latest/bios/seabios.bin" },
        vga_bios: { url: "https://unpkg.com/v86@latest/bios/vgabios.bin" },
        cdrom: { url: "/debian-gnome-macos.iso" }, // Generated by GitHub Action
        autostart: true,
      });
    });
  </script>
</body>
</html>
